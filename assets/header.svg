<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.5" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="reveal">
      <rect x="195" y="60" width="0" height="80">
        <animate attributeName="width" from="0" to="430" dur="1.1s"
                 begin="0.3s" fill="freeze" calcMode="spline"
                 keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="820" height="240" rx="14" fill="#0a0a0a"/>
  <rect width="820" height="240" rx="14" fill="url(#glow)"/>
  <rect width="820" height="240" rx="14" fill="none" stroke="#1a1a1a"/>

  <!-- scanline shimmer -->
  <rect x="0" y="0" width="820" height="1.5" fill="#dc2626" opacity="0.4">
    <animate attributeName="y" values="0;240;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="410" y="40" text-anchor="middle" fill="#737373" font-size="11" letter-spacing="4">
    A U T O M A T E D   W E B   S E C U R I T Y   A U D I T O R
  </text>

  <!-- typewriter title -->
  <g clip-path="url(#reveal)">
    <text x="410" y="116" text-anchor="middle" fill="url(#grad)"
          font-size="76" font-weight="bold" letter-spacing="2">WebScan</text>
  </g>
  <!-- blinking caret after the title reveal -->
  <rect x="619" y="60" width="5" height="76" fill="#f87171" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.12;0.13"
             dur="1.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- animated gradient underline -->
  <rect x="195" y="132" width="0" height="2" rx="1" fill="url(#grad)">
    <animate attributeName="width" from="0" to="430" dur="1.1s" begin="0.4s"
             fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>

    <text x="410" y="168" text-anchor="middle" fill="#f87171" font-size="16" font-family="SFMono-Regular,Consolas,monospace" opacity="0" letter-spacing="0.5">41 plugins · 7.1s · content-verified · zero false positives<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.000;0.031;0.219;0.250;1.000" dur="9.6s" repeatCount="indefinite"/></text>
  <text x="410" y="168" text-anchor="middle" fill="#f87171" font-size="16" font-family="SFMono-Regular,Consolas,monospace" opacity="0" letter-spacing="0.5">SSTI · XXE · IDOR · LFI · CSRF · cache poisoning · smuggling<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.250;0.281;0.469;0.500;1.000" dur="9.6s" repeatCount="indefinite"/></text>
  <text x="410" y="168" text-anchor="middle" fill="#f87171" font-size="16" font-family="SFMono-Regular,Consolas,monospace" opacity="0" letter-spacing="0.5">safe mode · stealth · retry · soft-404 · confidence dimension<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.500;0.531;0.719;0.750;1.000" dur="9.6s" repeatCount="indefinite"/></text>
  <text x="410" y="168" text-anchor="middle" fill="#f87171" font-size="16" font-family="SFMono-Regular,Consolas,monospace" opacity="0" letter-spacing="0.5">for site owners, bug hunters and security researchers<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.750;0.781;0.969;1.000;1.000" dur="9.6s" repeatCount="indefinite"/></text>

  <!-- severity dots pulsing -->
  <g transform="translate(338, 200)">
        <circle cx="0" cy="0" r="5" fill="#dc2626"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="24" cy="0" r="5" fill="#db6d28"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="0" r="5" fill="#d29922"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="72" cy="0" r="5" fill="#3b82f6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="0" r="5" fill="#22c55e"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <!-- version badge -->
  <text x="520" y="204" fill="#737373" font-size="11"
        font-family="SFMono-Regular,Consolas,monospace">v2.8.0</text>
</svg>
