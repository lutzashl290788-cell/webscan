[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webscan-security"
version = "2.8.0"
description = "CLI security auditing tool for web configuration vulnerabilities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "lutzashl290788-cell" },
]
keywords = ["security", "pentest", "web", "scanner", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "aiohttp>=3.14.3,<4",
    "PyYAML>=6.0.3,<7",
]

[project.urls]
Homepage = "https://github.com/lutzashl290788-cell/webscan"
Repository = "https://github.com/lutzashl290788-cell/webscan"
Issues = "https://github.com/lutzashl290788-cell/webscan/issues"
Changelog = "https://github.com/lutzashl290788-cell/webscan/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ai = [
    "anthropic>=0.120.2,<1",
]
serve = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.1,<1",
]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "mypy>=2.3.0,<3",
    "ruff>=0.16.1,<1",
    "types-PyYAML>=6.0.12.20260724,<7",
]

[project.scripts]
webscan = "webscan.cli:main"

# Built-in plugins are registered here so they are discovered via importlib
# entry points; third-party packages can add their own under the same group.
[project.entry-points."webscan.plugins"]
config_files = "webscan.plugins.config_files:ConfigFilesPlugin"
secrets = "webscan.plugins.secrets:SecretsPlugin"
headers = "webscan.plugins.headers:HeadersPlugin"
directories = "webscan.plugins.directories:DirectoriesPlugin"
sql_injection = "webscan.plugins.sql_injection:SqlInjectionPlugin"
xss = "webscan.plugins.xss:XssPlugin"
path_traversal = "webscan.plugins.path_traversal:PathTraversalPlugin"
open_redirect = "webscan.plugins.open_redirect:OpenRedirectPlugin"
ssrf = "webscan.plugins.ssrf:SsrfPlugin"
cors = "webscan.plugins.cors:CorsPlugin"
cookies = "webscan.plugins.cookies:CookiesPlugin"
http_methods = "webscan.plugins.http_methods:HttpMethodsPlugin"
ssl_tls = "webscan.plugins.ssl_tls:SslTlsPlugin"
security_txt = "webscan.plugins.security_txt:SecurityTxtPlugin"
tech_fingerprint = "webscan.plugins.tech_fingerprint:TechFingerprintPlugin"
robots_sitemap = "webscan.plugins.robots_sitemap:RobotsSitemapPlugin"
subdomains = "webscan.plugins.subdomains:SubdomainsPlugin"
graphql = "webscan.plugins.graphql:GraphqlPlugin"
cve_lookup = "webscan.plugins.cve_lookup:CveLookupPlugin"
jwt_audit = "webscan.plugins.jwt_audit:JwtAuditPlugin"
csrf = "webscan.plugins.csrf:CsrfPlugin"
lfi_rfi = "webscan.plugins.lfi_rfi:LfiRfiPlugin"
xxe = "webscan.plugins.xxe:XxePlugin"
idor = "webscan.plugins.idor:IdorPlugin"
clickjacking = "webscan.plugins.clickjacking:ClickjackingPlugin"
cache_poisoning = "webscan.plugins.cache_poisoning:CachePoisoningPlugin"
host_header_injection = "webscan.plugins.host_header_injection:HostHeaderInjectionPlugin"
ssti = "webscan.plugins.ssti:SstiPlugin"
backup_files = "webscan.plugins.backup_files:BackupFilesPlugin"
verbose_errors = "webscan.plugins.verbose_errors:VerboseErrorsPlugin"
mass_assignment = "webscan.plugins.mass_assignment:MassAssignmentPlugin"
prototype_pollution = "webscan.plugins.prototype_pollution:PrototypePollutionPlugin"
graphql_depth = "webscan.plugins.graphql_depth:GraphqlDepthPlugin"
file_upload = "webscan.plugins.file_upload:FileUploadPlugin"
race_condition = "webscan.plugins.race_condition:RaceConditionPlugin"
request_smuggling = "webscan.plugins.request_smuggling:RequestSmugglingPlugin"
web_cache_deception = "webscan.plugins.web_cache_deception:WebCacheDeceptionPlugin"
websocket_security = "webscan.plugins.websocket_security:WebsocketSecurityPlugin"
dns_security = "webscan.plugins.dns_security:DnsSecurityPlugin"
csp_analyzer = "webscan.plugins.csp_analyzer:CspAnalyzerPlugin"
waf_detect = "webscan.plugins.waf_detect:WafDetectPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["webscan*"]

# ─── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# webscan.server uses FastAPI decorators that mypy can only see when the
# optional `serve` extra is installed. Disabling warn_unused_ignores for this
# single module prevents CI (no fastapi) from failing on `# type: ignore`
# comments that are required locally (with fastapi).
[[tool.mypy.overrides]]
module = "webscan.server"
warn_unused_ignores = false

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "BLE", "C4", "PTH"]
# Keep backwards-compatible spellings; modernizing them is a separate change.
ignore = ["UP017", "UP041", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately need typing.Any for fakes / shims / SDK stand-ins, and
# they often don't need explicit returns. ANN401 (Any) is a no-op noise on tests.
"tests/**/*.py" = ["ANN401", "ANN001", "ANN201", "ANN204", "E501"]
"webscan/plugins/dns_security.py" = ["E501"]
"webscan/plugins/waf_detect.py" = ["E501"]
"webscan/plugins/csp_analyzer.py" = ["E501"]
"webscan/autofix.py" = ["E501"]
"webscan/notify.py" = ["E501"]
"webscan/diff.py" = ["E501"]
"webscan/dashboard.py" = ["E501"]

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ─── Coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["webscan"]
omit = ["webscan/venv/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
