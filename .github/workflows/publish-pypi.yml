name: Publish to PyPI

# Publishing is deliberately separate from Auto Release: a GitHub release is
# cheap to redo, a PyPI upload is permanent. Keeping them apart means a failed
# upload never blocks the release notes, and a release can be re-cut without
# attempting a second upload of the same version.
#
# Authentication is PyPI Trusted Publishing (OIDC) — no API token is stored in
# this repository. The publisher must be registered on PyPI against this exact
# workflow filename (publish-pypi.yml) and the `pypi` environment.
# See: https://docs.pypi.org/trusted-publishers/adding-a-publisher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v2.8.3"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Refuse to publish a version that disagrees with the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(python -c \
            "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} would publish version ${VERSION}"
            exit 1
          fi
          echo "tag ${TAG} matches version ${VERSION}"

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/webscan --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Optional but strongly encouraged by PyPI: the environment is what lets you
    # require a manual approval before anything is uploaded.
    environment: pypi
    permissions:
      # Mandatory for Trusted Publishing, and scoped to this job rather than the
      # whole workflow so the build job cannot mint a token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
