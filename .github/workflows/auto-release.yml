name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          # Validate the tag is a proper semver (vMAJOR.MINOR.PATCH with optional
          # pre-release suffix). This prevents path-traversal via --notes-file
          # if a tag like `../../pwned` ever slipped through git's own rules.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$'; then
            echo "::error::refusing to release tag '$TAG' (not a valid semver vMAJOR.MINOR.PATCH[-suffix])"
            exit 1
          fi

          echo "Releasing $TAG"

          # Retagging an existing release (a moved tag, or a re-run of this job)
          # must not fail the workflow: create the release the first time, update
          # it in place afterwards.
          if gh release view "$TAG" >/dev/null 2>&1; then
            ACTION=edit
            echo "Release $TAG already exists — updating it in place"
          else
            ACTION=create
          fi

          # Try to load release notes from .github/release-notes/
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from $NOTES_FILE"
            # Prefer the notes file's own H1 as the release title, so a release
            # keeps its descriptive name; fall back to the bare version.
            TITLE=$(sed -n 's/^# \(.*\)/\1/p' "$NOTES_FILE" | head -1)
            [ -n "$TITLE" ] || TITLE="WebScan $TAG"
            gh release "$ACTION" "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          elif [ "$ACTION" = create ]; then
            # Fallback: extract from CHANGELOG
            echo "No release notes file, generating from CHANGELOG"
            gh release create "$TAG" \
              --title "WebScan $TAG" \
              --generate-notes \
              --latest
          else
            # No notes file and the release already exists: leave its body alone
            # rather than replacing hand-written notes with generated ones.
            echo "No release notes file — leaving the existing $TAG notes unchanged"
            gh release edit "$TAG" --latest
          fi
