name: Feature request
description: Propose a new plugin, CLI flag, output format, or other enhancement
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New plugin (security check)
        - Existing plugin improvement
        - CLI flag or behaviour
        - Report format or output
        - Engine, crawler, or networking
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: >
        What gap does this address, and who is affected? For example:
        "There is no way to detect X, which means ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        What would you like added or changed? For a new plugin, include what it
        checks, what a finding looks like, the severity and confidence you would
        assign, and the remediation guidance.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you looked at, and why you prefer this one.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to specs, CVEs, similar tools, or example output.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
