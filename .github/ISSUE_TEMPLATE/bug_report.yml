name: Bug report
description: Something is broken or behaving unexpectedly
title: "bug: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Please do not report security vulnerabilities here.** Use the process
        in [SECURITY.md](https://github.com/lutzashl290788-cell/webscan/blob/main/SECURITY.md)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug — what you did, and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        The exact command you ran. If the target is not publicly reachable,
        describe the response or paste headers you can share safely.
      render: shell
      placeholder: webscan -t https://example.com --safe-mode
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output or traceback
      description: Paste the full CLI output or stack trace.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: WebScan version
      description: "Output of `webscan --version`"
      placeholder: webscan 2.8.1
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - Other (state it below)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 / macOS 15 / Windows 11
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - pip install webscan-security
        - pip install -e ".[dev]" (from source)
        - Docker (ghcr.io)
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, related issues, or anything else that helps.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability report.
          required: true
